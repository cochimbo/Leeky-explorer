[package]
name = "leeky-explorer"
version = "0.4.0"
edition = "2024"
authors = ["cochimbo"]
description = "A fast, dual-pane terminal file manager with archive support"
repository = "https://github.com/cochimbo/Leeky-explorer"
license = "MIT"
keywords = ["file-manager", "tui", "terminal", "dual-pane", "archive"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
ratatui = "0.29.0"
crossterm = "0.29.0"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"  # For async trait definitions
walkdir = "2.5"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "6.0.0"
async-recursion = "1.0"
glob = "0.3"
ignore = "0.4"  # TASK-038: Recursive search with .gitignore support
encoding_rs = "0.8"
log = "0.4"
env_logger = "0.11"  # T851: Logging implementation
chrono = { version = "0.4", features = ["serde"] }  # T851b: Timestamps for structured logs; TASK-001: serde support for bookmarks
image = "0.25"
viuer = "0.9.2"
tui-textarea = "0.7"  # TASK-027: Text editor widget compatible with ratatui 0.29
# T801-T803: Archive extraction dependencies
zip = { version = "6.0.0", features = ["aes-crypto"] }  # T908: Enable AES encryption for compression
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.6.1"
sevenz-rust = "0.6.1"
# T845: Disk space checking
fs2 = "0.4"
# US3: Unicode width calculation for proper emoji alignment
unicode-width = "0.2.0"
# Remote connections: SFTP, SMB, FTP
ssh2 = "0.9"  # SFTP support via libssh2
suppaftp = { version = "6.0", features = ["secure"] }  # FTP/FTPS support
base64 = "0.22"  # For known_hosts file encoding
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service"] }  # Secure credential storage using OS keychain
uuid = { version = "1.0", features = ["v4"] }  # UUID generation for connection IDs

# SMB/CIFS support (TASK-055)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_NetworkManagement_WNet", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
# For Linux/macOS: will use smbclient command-line tool as fallback for now
# TODO: Consider libsmb2 bindings in the future for pure Rust implementation

[dev-dependencies]
tempfile = "3.8"
