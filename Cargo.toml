[package]
name = "leeky-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.25"
crossterm = "0.27"
tokio = { version = "1.35", features = ["full"] }
walkdir = "2.5"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
async-recursion = "1.0"
glob = "0.3"

[dev-dependencies]
tempfile = "3.8"
