[package]
name = "leeky-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.25"
crossterm = "0.27"
tokio = { version = "1.35", features = ["full"] }
walkdir = "2.5"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
async-recursion = "1.0"
glob = "0.3"
encoding_rs = "0.8"
log = "0.4"
image = "0.25"
viuer = "0.7"
# T801-T803: Archive extraction dependencies
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.4"
sevenz-rust = "0.5"

[dev-dependencies]
tempfile = "3.8"
