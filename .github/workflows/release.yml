name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Run tests first
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # Build for Linux
  build-linux:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Create archive
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          mkdir -p assets/images
          cp ../../../assets/images/leekpc.png assets/images/
          tar -czf leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz leeky-explorer assets/
          sha256sum leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz > leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz
            target/x86_64-unknown-linux-gnu/release/leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

  # Build for Windows
  build-windows:
    name: Build Windows x86_64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create archive
        shell: powershell
        run: |
          cd target\x86_64-pc-windows-msvc\release
          New-Item -ItemType Directory -Force -Path assets\images
          Copy-Item ..\..\..\assets\images\leekpc.png assets\images\
          Compress-Archive -Path leeky-explorer.exe,assets -DestinationPath "leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip"
          Get-FileHash "leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip" -Algorithm SHA256 | Select-Object -ExpandProperty Hash | Out-File "leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip.sha256" -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip
            target/x86_64-pc-windows-msvc/release/leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip.sha256

  # Build for macOS Intel
  build-macos-intel:
    name: Build macOS x86_64
    needs: test
    runs-on: macos-13  # Intel runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build release
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create archive
        run: |
          cd target/x86_64-apple-darwin/release
          mkdir -p assets/images
          cp ../../../assets/images/leekpc.png assets/images/
          tar -czf leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz leeky-explorer assets/
          shasum -a 256 leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz > leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            target/x86_64-apple-darwin/release/leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz
            target/x86_64-apple-darwin/release/leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz.sha256

  # Build for macOS ARM (M1/M2)
  build-macos-arm:
    name: Build macOS ARM64
    needs: test
    runs-on: macos-14  # ARM runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create archive
        run: |
          cd target/aarch64-apple-darwin/release
          mkdir -p assets/images
          cp ../../../assets/images/leekpc.png assets/images/
          tar -czf leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz leeky-explorer assets/
          shasum -a 256 leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz > leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            target/aarch64-apple-darwin/release/leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz
            target/aarch64-apple-darwin/release/leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz.sha256

  # Build for Linux ARM64 (Raspberry Pi 3/4/5, 64-bit)
  build-linux-arm64:
    name: Build Linux ARM64 (Raspberry Pi 64-bit)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4



      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools and sysroot
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config qemu-user-static libdbus-1-dev:arm64
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Create archive
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          mkdir -p assets/images
          cp ../../../assets/images/leekpc.png assets/images/
          tar -czf leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz leeky-explorer assets/
          sha256sum leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz > leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            target/aarch64-unknown-linux-gnu/release/leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz
            target/aarch64-unknown-linux-gnu/release/leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz.sha256

  # Build for Linux ARMv7 (Raspberry Pi 2/3, 32-bit)
  build-linux-armv7:
    name: Build Linux ARMv7 (Raspberry Pi 32-bit)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4



      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install cross-compilation tools and sysroot
        run: |
          sudo dpkg --add-architecture armhf
          sudo tee /etc/apt/sources.list.d/armhf.list > /dev/null <<EOF
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross pkg-config qemu-user-static libdbus-1-dev:armhf
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig" >> $GITHUB_ENV


      - name: Build release
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build --release --target armv7-unknown-linux-gnueabihf

      - name: Create archive
        run: |
          cd target/armv7-unknown-linux-gnueabihf/release
          mkdir -p assets/images
          cp ../../../assets/images/leekpc.png assets/images/
          tar -czf leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz leeky-explorer assets/
          sha256sum leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz > leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7
          path: |
            target/armv7-unknown-linux-gnueabihf/release/leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz
            target/armv7-unknown-linux-gnueabihf/release/leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz.sha256

  # Create GitHub Release
  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos-intel, build-macos-arm, build-linux-arm64, build-linux-armv7]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Leeky Explorer ${{ github.ref_name }}
          body: |
            # Leeky Explorer ${{ github.ref_name }}
            
            A dual-pane terminal file explorer with Vim-like keybindings, built in Rust.
            
            ## Features
            - 🚀 Dual-pane navigation with Vim-like keybindings
            - 📁 File operations (copy, move, delete, rename)
            - 📦 Archive support (ZIP, TAR, GZ, BZ2, XZ)
            - 👁️ File preview (text and images)
            - ✅ Multi-selection with visual mode
            - 🔍 Search and filter
            - 💾 File size formatting
            - 🛡️ Comprehensive error handling
            
            ## Installation
            
            Download the appropriate binary for your platform below, extract it, and run:
            
            ### Linux
            ```bash
            wget https://github.com/cochimbo/Leeky-explorer/releases/download/${{ github.ref_name }}/leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz
            tar -xzf leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz
            chmod +x leeky-explorer
            ./leeky-explorer
            ```
            
            ### Windows
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/cochimbo/Leeky-explorer/releases/download/${{ github.ref_name }}/leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip" -OutFile leeky-explorer.zip
            Expand-Archive leeky-explorer.zip
            .\leeky-explorer\leeky-explorer.exe
            ```
            
            ### macOS (Intel)
            ```bash
            curl -L -o leeky-explorer.tar.gz https://github.com/cochimbo/Leeky-explorer/releases/download/${{ github.ref_name }}/leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz
            tar -xzf leeky-explorer.tar.gz
            chmod +x leeky-explorer
            ./leeky-explorer
            ```
            
            ### macOS (Apple Silicon M1/M2)
            ```bash
            curl -L -o leeky-explorer.tar.gz https://github.com/cochimbo/Leeky-explorer/releases/download/${{ github.ref_name }}/leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz
            tar -xzf leeky-explorer.tar.gz
            chmod +x leeky-explorer
            ./leeky-explorer
            ```
            
            ### Linux ARM64 (Raspberry Pi 3/4/5 - 64-bit OS)
            ```bash
            wget https://github.com/cochimbo/Leeky-explorer/releases/download/${{ github.ref_name }}/leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz
            tar -xzf leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz
            chmod +x leeky-explorer
            ./leeky-explorer
            ```
            
            ### Linux ARMv7 (Raspberry Pi 2/3 - 32-bit OS)
            ```bash
            wget https://github.com/cochimbo/Leeky-explorer/releases/download/${{ github.ref_name }}/leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz
            tar -xzf leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz
            chmod +x leeky-explorer
            ./leeky-explorer
            ```
            
            ## Verify checksums
            
            Each binary includes a `.sha256` file for verification:
            ```bash
            sha256sum -c leeky-explorer-*.sha256  # Linux
            shasum -a 256 -c leeky-explorer-*.sha256  # macOS
            ```
            
            ## Full Changelog
            
            See [CHANGELOG.md](https://github.com/cochimbo/Leeky-explorer/blob/main/CHANGELOG.md) for details.
          files: |
            linux-x86_64/leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz
            linux-x86_64/leeky-explorer-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            linux-arm64/leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz
            linux-arm64/leeky-explorer-${{ github.ref_name }}-linux-arm64.tar.gz.sha256
            linux-armv7/leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz
            linux-armv7/leeky-explorer-${{ github.ref_name }}-linux-armv7.tar.gz.sha256
            windows-x86_64/leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip
            windows-x86_64/leeky-explorer-${{ github.ref_name }}-windows-x86_64.zip.sha256
            macos-x86_64/leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz
            macos-x86_64/leeky-explorer-${{ github.ref_name }}-macos-x86_64.tar.gz.sha256
            macos-arm64/leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz
            macos-arm64/leeky-explorer-${{ github.ref_name }}-macos-arm64.tar.gz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
